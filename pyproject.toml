[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeops"
version = "0.1.0"
description = "LifeOps — Personal Data Lakehouse: local-first ingestion, medallion storage, and personal analytics."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LifeOps Owner" }]
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0.29,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "minio>=7.2,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "testcontainers[postgres,minio]>=4.7,<5",
]

[tool.setuptools.packages.find]
include = ["lifeops_core*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "services", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "I001"]
"scripts/*" = ["B010"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = "services/ingestion_api:services/insights_api"
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "\\.venv/", "build/"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["minio.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires Postgres/MinIO (containers or TEST_* env vars)",
    "unit: pure unit tests, no external services",
]

[tool.coverage.run]
source = ["lifeops_core", "services/ingestion_api/app", "services/insights_api/app"]
omit = ["*/__main__.py"]
