name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifeops
          POSTGRES_PASSWORD: lifeops
          POSTGRES_DB: lifeops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: lifeops
          MINIO_ROOT_PASSWORD: lifeops-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://lifeops:lifeops@localhost:5432/lifeops_test
      TEST_MINIO_ENDPOINT: localhost:9000
      TEST_MINIO_ACCESS_KEY: lifeops
      TEST_MINIO_SECRET_KEY: lifeops-secret
      MINIO_CONF: /tmp/.mc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: mypy (typing)
        run: mypy .
      - name: dbt compile + dbt test  # enabled when dbt models land (Phase 5)
        run: echo "Placeholder until Phase 5 — replaced with dbt build --profile ci"
      - name: pytest
        run: pytest -m "integration or unit"

  build:
    name: Docker images
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build ingestion-api image
        run: docker build -f services/ingestion_api/Dockerfile -t lifeops/ingestion-api:ci .
      - name: Build insights-api image
        run: docker build -f services/insights_api/Dockerfile -t lifeops/insights-api:ci .
