name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://lifeops:lifeops@localhost:5432/lifeops_test
      TEST_MINIO_ENDPOINT: localhost:9000
      TEST_MINIO_ACCESS_KEY: lifeops
      TEST_MINIO_SECRET_KEY: lifeops-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Postgres as an Actions service container (official image, still public).
      - name: Start Postgres service
        run: |
          docker run -d --name lifeops-postgres \
            -e POSTGRES_USER=lifeops -e POSTGRES_PASSWORD=lifeops -e POSTGRES_DB=lifeops_test \
            -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec lifeops-postgres pg_isready -U lifeops -d lifeops_test >/dev/null 2>&1; then
              echo "postgres ready"; break
            fi
            sleep 2
          done

      # S3-compatible object store.
      # 2026 note: MinIO's official images are login/license-gated on all
      # registries, and bitnami/minio was removed - use SeaweedFS (Apache-2.0,
      # S3-compatible), the same image as docker-compose, via a plain docker
      # run step so we can pass the S3-mode command flags.
      - name: Start S3-compatible object store (SeaweedFS)
        run: |
          docker run -d --name object-store -p 9000:9000 -p 9333:9333 \
            chrislusf/seaweedfs:latest server -dir /data -s3 -s3.port=9000 -volume.max=0
          ready=0
          # generous budget: cold runner + image pull + raft leader election
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9333/cluster/status >/dev/null 2>&1; then
              ready=1; echo "object store ready after $i attempts"; break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then docker logs object-store | tail -30; exit 1; fi
          # S3 API must be reachable from the host runner (tests connect here)
          curl -fsS -o /dev/null "http://127.0.0.1:9000/" || {
            echo "s3 port check failed"; docker logs object-store | tail -30; exit 1; }

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: mypy (typing)
        run: mypy .
      - name: dbt compile + dbt test  # enabled when dbt models land (Phase 5)
        run: echo "Placeholder until Phase 5 - replaced with dbt build --profile ci"
      - name: pytest (unit + integration)
        run: pytest

  build:
    name: Docker images
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build ingestion-api image
        run: docker build -f services/ingestion_api/Dockerfile -t lifeops/ingestion-api:ci .
      - name: Build insights-api image
        run: docker build -f services/insights_api/Dockerfile -t lifeops/insights-api:ci .
