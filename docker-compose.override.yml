# Development conveniences layered on top of docker-compose.yml.
# Usage: docker compose up  (override is picked up automatically)
services:
  migrate:
    environment:
      DATABASE_URL: postgresql+psycopg://lifeops:lifeops@postgres:5432/lifeops

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  ingestion-api:
    build:
      target: dev
    volumes:
      - ./lifeops_core:/opt/lifeops/lifeops_core:ro
      - ./services/ingestion_api/ingestion_app:/opt/lifeops/ingestion_app:ro
      - ./tests:/opt/lifeops/tests:ro
    command: >
      uvicorn ingestion_app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir ingestion_app --reload-dir lifeops_core

  insights-api:
    build:
      target: dev
    volumes:
      - ./lifeops_core:/opt/lifeops/lifeops_core:ro
      - ./services/insights_api/insights_app:/opt/lifeops/insights_app:ro

  # One-shot pytest run against the compose Postgres + MinIO.
  #   docker compose run --rm tests
  #   docker compose run --rm tests pytest tests/unit -q
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: services/ingestion_api/Dockerfile
      target: dev
    command: ["pytest", "-m", "integration or unit"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://lifeops:lifeops@postgres:5432/lifeops_test
      TEST_MINIO_ENDPOINT: minio:9000
      TEST_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lifeops}
      TEST_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-lifeops-secret}
      MINIO_BUCKET: lifeops-test
      DATABASE_URL: postgresql+psycopg://lifeops:lifeops@postgres:5432/lifeops
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lifeops}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-lifeops-secret}
    volumes:
      - ./tests:/opt/lifeops/tests:ro
      - ./lifeops_core:/opt/lifeops/lifeops_core:ro
      - ./scripts:/opt/lifeops/scripts:ro
      - ./services/ingestion_api/ingestion_app:/opt/lifeops/ingestion_app:ro
      - ./services/insights_api/insights_app:/opt/lifeops/insights_app:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
